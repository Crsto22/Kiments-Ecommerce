<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Alta Costura - Hero Tríptico</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        // Colores base (se sobrescribirán dinámicamente)
                        brand: {
                            text: '#1a1a1a',
                            muted: '#5e5e5e',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Transición suave para el color de fondo de toda la página */
        body {
            transition: background-color 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden; /* Evitar scroll general */
        }

        /* Utilidad para el recorte (clip-path) al animar la entrada del texto */
        .text-reveal-mask {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }

        .text-slide-up {
            transform: translateY(120%);
            opacity: 0;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s ease;
        }

        .slide-active .text-slide-up {
            transform: translateY(0);
            opacity: 1;
        }

        /* Delays para el texto */
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }
        .delay-400 { transition-delay: 400ms; }

        /* Animación para las imágenes del tríptico (Cascada) */
        .triptych-img-wrapper {
            overflow: hidden;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
        }

        .slide-active .triptych-img-wrapper {
            transform: scaleY(1);
        }

        .triptych-img {
            transform: scale(1.5);
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .slide-active .triptych-img {
            transform: scale(1);
        }

        /* Delays para las 3 imágenes (Efecto cascada) */
        .img-delay-1 { transition-delay: 100ms; }
        .img-delay-2 { transition-delay: 300ms; }
        .img-delay-3 { transition-delay: 500ms; }

        /* Estado inactivo de los slides */
        .hero-slide {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            inset: 0;
            transition: opacity 1s ease;
            z-index: 0;
        }

        .hero-slide.slide-active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        /* Estilos del indicador rotativo */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.5s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>

<!-- El color de fondo cambiará vía JS. Iniciamos con el primer color. -->
<body class="font-sans text-brand-text h-screen flex flex-col antialiased selection:bg-brand-text selection:text-white" style="background-color: #F4EBE6;">

    <nav class="absolute top-0 left-0 w-full z-50 flex items-center justify-between px-8 md:px-16 py-8 mix-blend-color-burn">
        <!-- Izquierda: Menú -->
        <button class="flex items-center gap-2 hover:opacity-60 transition-opacity font-sans text-sm tracking-widest uppercase">
            <i class="ph ph-list text-xl"></i>
            <span class="hidden md:inline">Menú</span>
        </button>

        <!-- Centro: Logo -->
        <div class="text-3xl font-serif tracking-[0.15em] uppercase font-light text-center absolute left-1/2 transform -translate-x-1/2">
            Atelier<br><span class="text-[0.4em] tracking-[0.4em] font-sans block mt-1">Collection</span>
        </div>

        <!-- Derecha: Utilidades -->
        <div class="flex items-center gap-6 text-sm tracking-widest uppercase">
            <a href="#" class="hidden md:inline hover:opacity-60 transition-opacity">Boutique</a>
            <button class="hover:opacity-60 transition-opacity relative">
                <i class="ph ph-shopping-bag text-xl"></i>
                <span class="absolute -top-1 -right-2 w-4 h-4 bg-brand-text text-white text-[10px] flex items-center justify-center rounded-full">2</span>
            </button>
        </div>
    </nav>

    <main id="slides-container" class="relative flex-1 w-full h-full">

        <!-- ================= SLIDE 1: VIOLETA ================= -->
        <!-- Data-bg define el color de fondo de este slide -->
        <div class="hero-slide slide-active flex flex-col md:flex-row items-center justify-between h-full w-full px-6 md:px-16 pt-24 md:pt-0" data-bg="#F4EBE6">
            
            <!-- Columna Izquierda: Información del Modelo -->
            <div class="w-full md:w-5/12 flex flex-col justify-center h-full z-20 pb-10 md:pb-0">
                <div class="text-reveal-mask mb-2">
                    <span class="block font-sans text-xs md:text-sm tracking-[0.4em] uppercase font-semibold text-[#3c2f2d]/70 text-slide-up delay-100">Modelo</span>
                </div>
                <div class="text-reveal-mask mb-8">
                    <h1 class="block font-serif text-7xl md:text-9xl lg:text-[140px] leading-none tracking-tight text-slide-up delay-200">
                        Violeta
                    </h1>
                </div>
                
                <div class="text-reveal-mask">
                    <div class="inline-block text-slide-up delay-300">
                        <button class="group flex items-center gap-3 bg-[#3c2f2d] text-white rounded-full px-8 py-4 shadow-md hover:bg-[#2a211f] transition-all duration-300">
                            <span class="font-sans text-[15px] font-medium tracking-wide">Comprar Ahora</span>
                            <i class="ph ph-arrow-right text-lg group-hover:translate-x-1 transition-transform duration-300"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Tríptico de Imágenes -->
            <div class="w-full md:w-7/12 h-[50vh] md:h-[85vh] flex items-center justify-center gap-2 md:gap-6 z-10">
                
                <!-- Imagen 1 (Izquierda, desplazada hacia arriba) -->
                <div class="w-1/3 h-[60%] md:h-[70%] transform -translate-y-6 md:-translate-y-12">
                    <div class="triptych-img-wrapper img-delay-1 w-full h-full rounded-tl-full rounded-br-full md:rounded-tl-[100px] md:rounded-br-[100px] overflow-hidden shadow-2xl">
                        <img src="https://images.unsplash.com/photo-1515347619152-155921c5b8b5?q=80&w=600&auto=format&fit=crop" class="triptych-img w-full h-full object-cover object-center" alt="Violeta Detalle Superior">
                    </div>
                </div>

                <!-- Imagen 2 (Centro, principal, grande) -->
                <div class="w-1/3 h-[80%] md:h-[90%] transform translate-y-4 md:translate-y-8 z-20">
                    <div class="triptych-img-wrapper img-delay-2 w-full h-full rounded-full md:rounded-[200px] overflow-hidden shadow-2xl border-4 md:border-8 border-[#F4EBE6]/50">
                        <img src="https://images.unsplash.com/photo-1550614000-4b95d4edfcdd?q=80&w=800&auto=format&fit=crop" class="triptych-img w-full h-full object-cover object-center" alt="Violeta Cuerpo Entero">
                    </div>
                </div>

                <!-- Imagen 3 (Derecha, desplazada hacia abajo) -->
                <div class="w-1/3 h-[50%] md:h-[60%] transform translate-y-12 md:translate-y-20">
                    <div class="triptych-img-wrapper img-delay-3 w-full h-full rounded-tr-[50px] rounded-bl-[50px] md:rounded-tr-[100px] md:rounded-bl-[100px] overflow-hidden shadow-xl">
                        <img src="https://images.unsplash.com/photo-1588117305388-c2631a279f82?q=80&w=600&auto=format&fit=crop" class="triptych-img w-full h-full object-cover object-center" alt="Violeta Textura">
                    </div>
                </div>
            </div>
        </div>


        <!-- ================= SLIDE 2: JULIETA ================= -->
        <div class="hero-slide flex flex-col md:flex-row items-center justify-between h-full w-full px-6 md:px-16 pt-24 md:pt-0" data-bg="#DCE2DF">
            
            <div class="w-full md:w-5/12 flex flex-col justify-center h-full z-20 pb-10 md:pb-0">
                <div class="text-reveal-mask mb-2">
                    <span class="block font-sans text-xs md:text-sm tracking-[0.4em] uppercase font-semibold text-[#3c2f2d]/70 text-slide-up delay-100">Modelo</span>
                </div>
                <div class="text-reveal-mask mb-8">
                    <h1 class="block font-serif text-7xl md:text-9xl lg:text-[140px] leading-none tracking-tight text-slide-up delay-200">
                        Julieta
                    </h1>
                </div>
                
                <div class="text-reveal-mask">
                    <div class="inline-block text-slide-up delay-300">
                        <button class="group flex items-center gap-3 bg-[#3c2f2d] text-white rounded-full px-8 py-4 shadow-md hover:bg-[#2a211f] transition-all duration-300">
                            <span class="font-sans text-[15px] font-medium tracking-wide">Comprar Ahora</span>
                            <i class="ph ph-arrow-right text-lg group-hover:translate-x-1 transition-transform duration-300"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="w-full md:w-7/12 h-[50vh] md:h-[85vh] flex items-center justify-center gap-2 md:gap-6 z-10">
                <div class="w-1/3 h-[60%] md:h-[70%] transform -translate-y-6 md:-translate-y-12">
                    <div class="triptych-img-wrapper img-delay-1 w-full h-full rounded-tl-full rounded-br-full md:rounded-tl-[100px] md:rounded-br-[100px] overflow-hidden shadow-2xl">
                        <img src="https://images.unsplash.com/photo-1502716119720-b23a93e5fe1b?q=80&w=600&auto=format&fit=crop" class="triptych-img w-full h-full object-cover object-center" alt="Julieta Detalle">
                    </div>
                </div>

                <div class="w-1/3 h-[80%] md:h-[90%] transform translate-y-4 md:translate-y-8 z-20">
                    <div class="triptych-img-wrapper img-delay-2 w-full h-full rounded-full md:rounded-[200px] overflow-hidden shadow-2xl border-4 md:border-8 border-[#DCE2DF]/50">
                        <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=800&auto=format&fit=crop" class="triptych-img w-full h-full object-cover object-center" alt="Julieta Principal">
                    </div>
                </div>

                <div class="w-1/3 h-[50%] md:h-[60%] transform translate-y-12 md:translate-y-20">
                    <div class="triptych-img-wrapper img-delay-3 w-full h-full rounded-tr-[50px] rounded-bl-[50px] md:rounded-tr-[100px] md:rounded-bl-[100px] overflow-hidden shadow-xl">
                        <img src="https://images.unsplash.com/photo-1485230895905-ef0cd77478ed?q=80&w=600&auto=format&fit=crop" class="triptych-img w-full h-full object-cover object-center" alt="Julieta Accesorio">
                    </div>
                </div>
            </div>
        </div>


        <!-- ================= SLIDE 3: ANGIE ================= -->
        <div class="hero-slide flex flex-col md:flex-row items-center justify-between h-full w-full px-6 md:px-16 pt-24 md:pt-0" data-bg="#EAE6DF">
            
            <div class="w-full md:w-5/12 flex flex-col justify-center h-full z-20 pb-10 md:pb-0">
                <div class="text-reveal-mask mb-2">
                    <span class="block font-sans text-xs md:text-sm tracking-[0.4em] uppercase font-semibold text-[#3c2f2d]/70 text-slide-up delay-100">Modelo</span>
                </div>
                <div class="text-reveal-mask mb-8">
                    <h1 class="block font-serif text-7xl md:text-9xl lg:text-[140px] leading-none tracking-tight text-slide-up delay-200">
                        Angie
                    </h1>
                </div>
                
                <div class="text-reveal-mask">
                    <div class="inline-block text-slide-up delay-300">
                        <button class="group flex items-center gap-3 bg-[#3c2f2d] text-white rounded-full px-8 py-4 shadow-md hover:bg-[#2a211f] transition-all duration-300">
                            <span class="font-sans text-[15px] font-medium tracking-wide">Comprar Ahora</span>
                            <i class="ph ph-arrow-right text-lg group-hover:translate-x-1 transition-transform duration-300"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="w-full md:w-7/12 h-[50vh] md:h-[85vh] flex items-center justify-center gap-2 md:gap-6 z-10">
                <div class="w-1/3 h-[60%] md:h-[70%] transform -translate-y-6 md:-translate-y-12">
                    <div class="triptych-img-wrapper img-delay-1 w-full h-full rounded-tl-full rounded-br-full md:rounded-tl-[100px] md:rounded-br-[100px] overflow-hidden shadow-2xl">
                        <img src="https://images.unsplash.com/photo-1554412933-514a83d2f3c8?q=80&w=600&auto=format&fit=crop" class="triptych-img w-full h-full object-cover object-center" alt="Angie Textura">
                    </div>
                </div>

                <div class="w-1/3 h-[80%] md:h-[90%] transform translate-y-4 md:translate-y-8 z-20">
                    <div class="triptych-img-wrapper img-delay-2 w-full h-full rounded-full md:rounded-[200px] overflow-hidden shadow-2xl border-4 md:border-8 border-[#EAE6DF]/50">
                        <img src="https://images.unsplash.com/photo-1539008835657-9e8e9680c956?q=80&w=800&auto=format&fit=crop" class="triptych-img w-full h-full object-cover object-center" alt="Angie Principal">
                    </div>
                </div>

                <div class="w-1/3 h-[50%] md:h-[60%] transform translate-y-12 md:translate-y-20">
                    <div class="triptych-img-wrapper img-delay-3 w-full h-full rounded-tr-[50px] rounded-bl-[50px] md:rounded-tr-[100px] md:rounded-bl-[100px] overflow-hidden shadow-xl">
                        <img src="https://images.unsplash.com/photo-1485968579580-b6d095142e6e?q=80&w=600&auto=format&fit=crop" class="triptych-img w-full h-full object-cover object-center" alt="Angie Movimiento">
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Controles en la parte inferior izquierda -->
    <div class="absolute bottom-8 md:bottom-12 left-6 md:left-16 flex items-center gap-8 z-40">
        
        <!-- Puntos de Paginación (Reemplazo del contador) -->
        <div class="flex items-center gap-2" id="paginationDots">
            <button class="dot-btn w-8 h-3 rounded-full bg-[#3c2f2d] transition-all duration-500" data-index="0"></button>
            <button class="dot-btn w-3 h-3 rounded-full bg-[#CBD5E1] transition-all duration-500 cursor-pointer hover:bg-[#9CA3AF]" data-index="1"></button>
            <button class="dot-btn w-3 h-3 rounded-full bg-[#CBD5E1] transition-all duration-500 cursor-pointer hover:bg-[#9CA3AF]" data-index="2"></button>
        </div>

        <!-- Botones de flechas minimalistas -->
        <div class="flex items-center gap-2">
            <button id="prevBtn" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-black/5 transition-colors group">
                <i class="ph-light ph-arrow-left text-2xl group-hover:-translate-x-1 transition-transform"></i>
            </button>
            <button id="nextBtn" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-black/5 transition-colors group">
                <i class="ph-light ph-arrow-right text-2xl group-hover:translate-x-1 transition-transform"></i>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const slides = document.querySelectorAll('.hero-slide');
            const totalSlides = slides.length;
            const body = document.body;
            
            // Elementos UI
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const dots = document.querySelectorAll('.dot-btn');
            
            let currentIndex = 0;
            let isAnimating = false;

            // Función para actualizar los puntos de paginación
            const updateDots = (index) => {
                dots.forEach((dot, i) => {
                    if (i === index) {
                        dot.className = "dot-btn w-8 h-3 rounded-full bg-[#3c2f2d] transition-all duration-500";
                    } else {
                        dot.className = "dot-btn w-3 h-3 rounded-full bg-[#CBD5E1] transition-all duration-500 cursor-pointer hover:bg-[#9CA3AF]";
                    }
                });
            };

            const changeSlide = (newIndex) => {
                if (isAnimating || newIndex === currentIndex) return;
                isAnimating = true;

                // 1. Quitar clase activa al actual
                slides[currentIndex].classList.remove('slide-active');

                // 2. Actualizar índice
                currentIndex = newIndex;

                // 3. Cambiar color de fondo del BODY dinámicamente
                const newBgColor = slides[currentIndex].getAttribute('data-bg');
                body.style.backgroundColor = newBgColor;

                // 4. Actualizar Puntos de paginación
                updateDots(currentIndex);

                // 5. Poner clase activa al nuevo
                setTimeout(() => {
                    slides[currentIndex].classList.add('slide-active');
                    
                    setTimeout(() => {
                        isAnimating = false;
                    }, 1500);
                }, 50);
            };

            // Eventos para los puntos (clicables)
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    changeSlide(index);
                });
            });

            // Eventos flechas
            nextBtn.addEventListener('click', () => {
                let next = (currentIndex === totalSlides - 1) ? 0 : currentIndex + 1;
                changeSlide(next);
            });

            prevBtn.addEventListener('click', () => {
                let prev = (currentIndex === 0) ? totalSlides - 1 : currentIndex - 1;
                changeSlide(prev);
            });
        });
    </script>
</body>
</html>
